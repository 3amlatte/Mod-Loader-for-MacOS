<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mod Loader for MacOS — vector preview</title>
<style>
  body { margin: 0; padding: 36px; background: #0d141b; color: #e8edf2;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  h1 { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: #93a4b8; margin: 0 0 22px; }
  .panel { border-radius: 18px; padding: 24px; margin-bottom: 20px; display: flex; align-items: center; gap: 26px; }
  .dark { background: #060a0e; border: 1px solid #1f2c37; }
  .light { background: #f4f6f8; border: 1px solid #d9e0e6; }
  .light h2 { color: #485463; }
  h2 { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #93a4b8; margin: 0 0 10px; }
  img.logo { width: min(860px, 100%); height: auto; display: block; }
  .sizes { display: flex; align-items: flex-end; gap: 26px; padding: 22px 24px; background: #060a0e;
           border: 1px solid #1f2c37; border-radius: 18px; }
  .sizes figure { margin: 0; text-align: center; }
  .sizes figcaption { font-size: 9px; color: #7f8e9e; margin-top: 8px; letter-spacing: .08em; }
  .note { font-size: 12px; color: #93a4b8; line-height: 1.6; max-width: 900px; }
  code { color: #7fd3c4; }
</style>
</head>
<body>
  <h1>Mod Loader for MacOS · vector lockup</h1>

  <div class="panel dark">
    <div>
      <h2>Wordmark · 1280 × 360</h2>
      <img class="logo" src="logo.svg" alt="Mod Loader for MacOS">
    </div>
  </div>

  <div class="panel light">
    <div>
      <h2 style="color:#5c6876">Same file on a light background</h2>
      <img class="logo" src="logo.svg" alt="Mod Loader for MacOS">
    </div>
  </div>

  <div class="sizes">
    <figure><img src="icon.svg" width="180" height="180" alt=""><figcaption>180 px</figcaption></figure>
    <figure><img src="icon.svg" width="96" height="96" alt=""><figcaption>96 px</figcaption></figure>
    <figure><img src="icon.svg" width="48" height="48" alt=""><figcaption>48 px</figcaption></figure>
    <figure><img src="icon.svg" width="32" height="32" alt=""><figcaption>32 px</figcaption></figure>
    <figure><img src="icon.svg" width="16" height="16" alt=""><figcaption>16 px</figcaption></figure>
  </div>

  <p class="note">Both files are plain SVG: <code>macos/logo.svg</code> and <code>macos/icon.svg</code>.
  Text is live vector text (not outlines), using the system UI font, so it stays crisp at any size.</p>
</body>
</html>
